<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      const repo = "/naimpro-hr-platform";
      const path = location.pathname.startsWith(repo)
        ? location.pathname.slice(repo.length)
        : location.pathname;

      sessionStorage.setItem("redirect", path);
      location.replace(repo + "/");
    </script>
  </head>
  <body></body>
</html>
